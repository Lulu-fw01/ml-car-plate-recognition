defaults:
  - _self_

task: "detect"

data:
  output_dir: "data/raw"
  root: "${data.output_dir}/detect"

model:
  name: "yolov5s"
  imgsz: 640

trainer:
  max_epochs: 50
  batch_size: 16
  num_workers: 4
  accelerator: "auto"
  devices: "auto"

logging:
  mlflow:
    tracking_uri: "http://127.0.0.1:8080"
    experiment_name: "detection"
