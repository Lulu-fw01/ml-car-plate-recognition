[project]
name = "ml-car-plate-recognition"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.8.0",
    "torchvision>=0.23.0",
    "ultralytics>=8.4.48",
    "pytorch-lightning>=2.6.0",
    "jiwer>=4.0.0",
    "hydra-core>=1.3.2",
    "grpcio>=1.60.0",
    "grpcio-reflection>=1.60.0",
    "omegaconf>=2.3.0",
    "numpy>=1.24",
    "Pillow>=10.0",
    "opencv-python>=4.9",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
training = [
    "mlflow>=3.1.4",
    "torchmetrics>=1.8.2",
    "albumentations>=2.0.8",
    "scikit-learn>=1.6.1",
    "seaborn>=0.13.2",
    "rapidfuzz>=3.13.0",
    "pyctcdecode>=0.5.0",
    "grpcio-tools>=1.60.0",
]
dev = [
    "ruff>=0.4",
    "pre-commit>=3.5",
    "pytest",
]

[tool.uv]
index-strategy = "unsafe-best-match"

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu" },
]
torchvision = [
  { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
train-yolo = "scripts.train_yolo:main"
train-ocr = "scripts.train_ocr:main"
download-data = "data.download:cli"
