[project]
name = "ml-car-plate-recognition"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "grpcio-reflection>=1.78.0",
    "grpcio-tools>=1.78.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

dependencies = [
    "torch>=2.0",
    "torchvision",
    "pytorch-lightning>=2.0",
    "hydra-core>=1.3",
    "mlflow>=2.10",
    "dvc>=3.0",
    "albumentations>=1.4",
    "opencv-python>=4.9",
    "ultralytics>=8.2",          # YOLOv8/v10
    "numpy",
    "Pillow",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "pre-commit>=3.5",
    "pytest",
]

[project.scripts]
train-yolo = "scripts.train_yolo:main"
train-ocr = "scripts.train_ocr:main"
download-data = "data.download:cli"
